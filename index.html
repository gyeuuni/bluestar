<script>
(() => {

const configured = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("여기에");

const STADIUMS = ["대구 삼성라이온즈파크", "포항야구장", "잠실야구장", "고척스카이돔", "수원 KT위즈파크", "인천 SSG랜더스필드", "창원NC파크", "광주-기아 챔피언스필드", "대전 한화생명볼파크", "사직야구장", "기타"];

let me = null;

  if (/Invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";

  const cm = m.match(/CONTEST_MAX:(\d+)/); if (cm) return `1인 ${cm[1]}표까지 투표할 수 있어요. 다른 작품의 표를 취소하면 다시 고를 수 있어요.`;

const BELL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;

// 더 보기: 처음 한 번 불러오고, 버튼을 누를 때마다 다음 묶음을 붙여요
function pager({ box, more, size = 20, fetch, item, empty }) {
  if (!box || !more) return;
  let page = 0;
  const load = async () => {
    const rows = await fetch(page * size, page * size + size - 1);
    if (!box.isConnected) return;
    if (page === 0 && !rows.length) box.innerHTML = empty;
    box.insertAdjacentHTML("beforeend", rows.map(item).join(""));
    hydratePhotos(box);
    page++;
    more.hidden = rows.length < size;
  };
  more.onclick = () => run(more, load);
  load().catch(e => { box.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; });
}

const gameSeg = cur => `<div class="seg"><a href="#mvp" class="${cur === "mvp" ? "on" : ""}">MVP 투표</a><a href="#schedule" class="${cur === "schedule" ? "on" : ""}">경기 일정</a></div>`;
async function renderSchedule(arg) {
  const today = kstToday();
  const ym = /^\d{4}-\d{2}$/.test(arg) ? arg : today.slice(0, 7);
  const [y, m] = ym.split("-").map(Number);
  const pad = n => String(n).padStart(2, "0");
  const nextYm = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`, prevYm = m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`;
  const from = `${ym}-01`, to = `${nextYm}-01`;
  const [games, meets] = await Promise.all([
    sb.from("schedule").select("*").gte("game_date", from).lt("game_date", to).order("game_date").then(must),
    sb.from("meetups").select("id,title,meet_at,place").gte("meet_at", new Date(from + "T00:00:00+09:00").toISOString()).lt("meet_at", new Date(to + "T00:00:00+09:00").toISOString()).order("meet_at").then(must),
  ]);
  const days = {};
  const add = (d, h) => { (days[d] = days[d] || []).push(h); };
  games.forEach(g => {
    const res = g.status === "final" && g.score_us != null ? `<span class="r ${g.score_us > g.score_them ? "win" : g.score_us < g.score_them ? "lose" : ""}">${g.score_us > g.score_them ? "승" : g.score_us < g.score_them ? "패" : "무"} ${g.score_us}:${g.score_them}</span>`
      : g.status === "canceled" ? `<span class="r">취소</span>` : `<span class="r">${esc(g.game_time)}</span>`;
    add(g.game_date, `<div class="ev ${g.game_date === today ? "today" : ""}"><span class="tag">${g.game_date === today ? "오늘 경기" : "경기"}</span><span><b>vs ${esc(g.opponent)}</b>${g.is_home === true ? `<span class="hw">홈</span>` : g.is_home === false ? `<span class="hw">원정</span>` : ""}<br><span class="muted">${esc(g.stadium)}${g.note ? " · " + esc(g.note) : ""}</span></span>${res}</div>`);
  });
  meets.forEach(x => add(kstDate(x.meet_at), `<a class="ev ${kstDate(x.meet_at) === today ? "today" : ""}" href="#meetup-${x.id}"><span class="tag meet">정모</span><span><b>${esc(x.title)}</b><br><span class="muted">${new Date(x.meet_at).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Seoul" })} · ${esc(x.place)}</span></span></a>`));
  const keys = Object.keys(days).sort();
  return `<div class="head"><h1>경기 일정</h1>${me.is_admin ? `<a class="btn sub sm" href="#games">경기 등록</a>` : ""}</div>${gameSeg("schedule")}
    <div class="monthnav"><a class="btn line sm" href="#schedule-${prevYm}">← 이전 달</a><b>${y}년 ${m}월</b><a class="btn line sm" href="#schedule-${nextYm}">다음 달 →</a></div>
    ${keys.length ? keys.map(d => `<div class="day ${d === today ? "today" : ""}"><h3>${fmtDate(d)}${d === today ? " · 오늘" : ""}</h3>${days[d].join("")}</div>`).join("")
      : `<div class="card empty"><b>이 달에는 일정이 없어요</b>경기 일정이 발표되면 파란별 AI가 채워 넣어요. 정모를 열면 여기에도 같이 보여요.</div>`}
    <p class="hint">경기 일정과 결과는 파란별 AI가 매일 확인해서 업데이트해요.</p>`;
}

function voteWindow(dateStr) {
  const start = new Date(dateStr + "T00:00:00+09:00");
  const end = new Date(start.getTime() + 36 * 3600 * 1000); // 다음날 낮 12시
  const now = new Date();
  return { open: now >= start && now < end, before: now < start, end };
}
function tally(list, key, names) {
  const c = Object.fromEntries(names.map(n => [n, 0]));
  list.forEach(v => { if (v[key] in c) c[v[key]]++; });
  const rows = Object.entries(c).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(([n, k], i) => `
    <div class="bar ${i === 0 && k > 0 ? "top" : ""}"><span class="name">${esc(n)}</span>
      <div class="track"><div class="fill" style="width:${(k / max) * 100}%"></div></div><span class="n">${k}표</span></div>`).join("")}</div>`;
}
// 경기 있는 날에만 보이는 '오늘의 라인업'
async function todayLineup() {
  const today = kstToday();
  const today0 = new Date(today + "T00:00:00+09:00").toISOString();
  const [{ data: sg }, { data: lu }] = await Promise.all([
    sb.from("schedule").select("*").eq("game_date", today).limit(1),
    sb.from("posts").select("id,body,link_site,created_at").eq("media_type", "lineup").gte("created_at", today0).order("created_at", { ascending: false }).limit(1),
  ]);
  const g = sg?.[0], p = lu?.[0];
  if (!g && !p) return "";
  const info = g ? `vs ${esc(g.opponent)} · ${esc(g.game_time)} · ${esc(g.stadium)}` : "";
  if (g && g.status === "canceled") return `<div class="card lineup"><div class="lhead"><b>오늘의 경기</b><span class="muted">${info}</span></div><p>오늘 경기는 <b>취소</b>됐어요.</p></div>`;
  if (!p) return `<div class="card lineup"><div class="lhead"><b>오늘의 라인업</b><span class="muted">${info}</span></div>
    <p class="muted">아직 라인업이 발표되지 않았어요. 보통 경기 1시간쯤 전에 올라와요.</p></div>`;
  const lines = p.body.split("\n").map(s => s.trim());
  const sp = (lines.find(s => /^선발\s*투수\s*[:：]/.test(s)) || "").replace(/^선발\s*투수\s*[:：]\s*/, "");
  const order = lines.map(s => s.match(/^(\d)\s*[.)]\s*(.+?)\s*\((.+?)\)\s*$/)).filter(Boolean);

// 접속 팝업 (오늘 하루 보지 않기 지원)
async function showPopup(force) {
  if (!me || $(".popup-bg")) return;
  let seen = false; try { seen = sessionStorage.getItem("pb-popup-seen") === "1"; } catch (e) {}
  if (seen && !force) return;
  const { data: p } = await sb.from("site_popup").select("*").eq("id", 1).maybeSingle();
  if (!p || !p.image_path || (!p.enabled && !force)) return;
  const key = `${p.updated_at}|${kstToday()}`;
  let hidden = false; try { hidden = localStorage.getItem("pb-popup-hide") === key; } catch (e) {}
  if (hidden && !force) return;
  try { sessionStorage.setItem("pb-popup-seen", "1"); } catch (e) {}
  const { data: s } = await sb.storage.from("photos").createSignedUrl(p.image_path, 3600);
  if (!s?.signedUrl || $(".popup-bg")) return;
  const wrap = document.createElement("div");
  wrap.className = "popup-bg"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true"); wrap.setAttribute("aria-label", "공지 팝업");
  const img = `<img src="${esc(s.signedUrl)}" alt="파란별 공지">`;
  wrap.innerHTML = `<div class="popup">${p.link_hash ? `<a class="pimg" href="#${esc(p.link_hash)}">${img}</a>` : img}
    <div class="pbar"><button type="button" data-hide>오늘 하루 보지 않기</button><button type="button" data-close>닫기</button></div></div>`;
  const close = () => wrap.remove();
  wrap.querySelector("[data-close]").onclick = close;
  wrap.querySelector("[data-hide]").onclick = () => { try { localStorage.setItem("pb-popup-hide", key); } catch (e) {} close(); };
  wrap.onclick = e => { if (e.target === wrap) close(); };
  const a = wrap.querySelector(".pimg"); if (a) a.addEventListener("click", close);
  document.addEventListener("keydown", function esc1(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc1); } });
  document.body.appendChild(wrap);
  wrap.querySelector("[data-close]").focus();
}

async function hydratePhotos(root = document) {
  const imgs = $$("img[data-photo]", root).filter(i => !i.getAttribute("src"));
  if (!imgs.length) return;
  const now = Date.now();
  const need = [...new Set(imgs.map(i => i.dataset.photo).filter(p => !(signed.get(p)?.t > now)))];
  if (need.length) {
    const { data } = await sb.storage.from("photos").createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) signed.set(d.path, { u: d.signedUrl, t: now + 50 * 60000 }); });
  }
  imgs.forEach(i => { const s = signed.get(i.dataset.photo); if (s) i.src = s.u; });
}

async function shrink(file, max = 1600, q = 0.82) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", q));
}

let contestTag = "전체";

const ytThumb = u => { const v = ytId(u); return v ? `https://i.ytimg.com/vi/${encodeURIComponent(v)}/mqdefault.jpg` : ""; };
const entryName = e => e.display_name ? `<span class="nick">${esc(e.display_name)}</span>` : nick(e.author);
async function renderContest() {
  const [c, entries, mine, res] = await Promise.all([

    sb.from("contest_entries").select(`*, author:profiles!author_id(${PROFILE})`).order("created_at", { ascending: false }).limit(500).then(must),
    sb.from("contest_votes").select("entry_id").eq("user_id", me.id).then(must),
    sb.rpc("contest_results").then(must),
  ]);
  const st = c.status;
  const myVotes = new Set((mine || []).map(v => v.entry_id));
  const counts = {}; (res || []).forEach(r => { counts[r.entry_id] = Number(r.votes); });
  const showCounts = st === "closed" || me.is_admin;
  const tags = ["전체", ...SHOT_TAGS.filter(tg => entries.some(e => e.shot_tag === tg)), ...[...new Set(entries.map(e => e.shot_tag))].filter(tg => !SHOT_TAGS.includes(tg))];
  if (!tags.includes(contestTag)) contestTag = "전체";
  const list = contestTag === "전체" ? entries : entries.filter(e => e.shot_tag === contestTag);
  const left = c.votes_per_member - myVotes.size;
  const ranked = [...entries].filter(e => counts[e.id]).sort((a, b) => counts[b.id] - counts[a.id]);
  const tile = e => `<button class="ctile" data-entry="${e.id}" aria-label="${esc(e.shot_tag)} 출품작 크게 보기">
      ${e.kind === "photo" ? `<img data-photo="${esc(e.image_path)}" alt="">` : `<img src="${esc(ytThumb(e.video_url))}" alt="" loading="lazy"><span class="cplay"></span>`}
      <span class="ctag">${esc(e.shot_tag)}</span>
      ${showCounts && counts[e.id] ? `<span class="cv">${counts[e.id]}표</span>` : st === "vote" && myVotes.has(e.id) ? `<span class="cv">내 표</span>` : ""}
      <span class="cby">${e.display_name ? esc(e.display_name) : esc(e.author?.nickname || "")}</span></button>`;
  after(() => {
    $$("[data-ctag]").forEach(b => b.onclick = () => { contestTag = b.dataset.ctag; router(); });
    $$("[data-entry]").forEach(b => b.onclick = () => openEntry(entries.find(e => e.id == b.dataset.entry), { st, myVotes, counts, showCounts }));
    bindContestUpload();
    bindContestAdmin(c);
  });
  return `
    <div class="chero">
      <span class="pill ${CSTATUS[st][1]}" style="align-self:flex-start;background:#fff">${CSTATUS[st][0]}</span>
      <h1>V9 우승 기념<br><span class="y">사진·영상 공모전</span></h1>
      <p>12년 만의 우승을 함께한 순간들을 모아 파란별 우승 기념 영상을 만들어요. 한 시즌 동안 찍은 사진과 영상을 보내 주세요!</p>
    </div>
    <div class="prizes">${PRIZES.map(([a, b, amt], i) => `<div>${giftCard(amt, i)}<span>${a}</span><b>${b}</b></div>`).join("")}</div>
    <p class="hint">수상작은 회원 투표로 정해요. ${st === "submit" ? "투표는 접수가 끝난 뒤 한 번에 진행해요." : ""}</p>
    ${st === "submit" ? contestUploadHtml() : ""}
    ${st === "vote" ? `<div class="msg"><b>투표 중이에요.</b> 마음에 드는 작품을 눌러 투표해 주세요. 1인 ${c.votes_per_member}표 · 남은 표 <b>${Math.max(0, left)}</b>표 · 내 작품에는 투표할 수 없어요.</div>` : ""}
    ${st === "closed" && ranked.length ? `<div class="card"><h2>수상작</h2>${contestRanking(ranked, counts)}</div>` : ""}
    <div class="head"><h2>출품작 ${entries.length}개</h2></div>
    ${entries.length ? `<div class="seg">${tags.map(tg => `<button data-ctag="${esc(tg)}" class="${tg === contestTag ? "on" : ""}">${esc(tg)}</button>`).join("")}</div>
      <div class="cgal">${list.map(tile).join("")}</div>`
      : `<div class="card empty"><b>첫 번째 출품작을 기다리고 있어요</b>우승 시즌을 함께한 사진을 올려 주세요.</div>`}
    ${me.is_admin ? contestAdminHtml(c, entries, counts, ranked) : ""}`;
}
function contestRanking(ranked, counts) {
  const label = i => i === 0 ? "1등" : i === 1 ? "2등" : i === 2 ? "3등" : i < 6 ? "장려" : `${i + 1}위`;
  return `<div class="list">${ranked.slice(0, 6).map((e, i) => `<div class="rank"><i>${label(i)}</i>
    ${e.kind === "photo" ? `<img data-photo="${esc(e.image_path)}" alt="">` : `<img src="${esc(ytThumb(e.video_url))}" alt="">`}
    <div style="min-width:0"><b>${entryName(e)}</b><p class="muted">${esc(e.shot_tag)} · ${counts[e.id]}표</p></div></div>`).join("")}</div>`;
}

      <p class="msg">보내주신 영상은 유튜브에 <b>‘일부 공개(외부 비공개)’</b>로 올라가요. 링크를 아는 사람만 볼 수 있고, 유튜브 검색이나 채널에는 나오지 않아요.</p>

function bindContestUpload() {
  const f = $("#cform"); if (!f) return;
  let files = [];
  $("#ctag").onchange = () => { const o = $("#ctag").value === "기타"; $("#ctag2w").hidden = !o; if (o) $("#ctag2").focus(); };
  $("#cfile").onchange = () => {
    const all = [...$("#cfile").files].filter(x => x.type.startsWith("image/"));
    const big = all.filter(x => x.size > 10 * 1024 * 1024);
    if (big.length) toast(`10MB가 넘는 사진 ${big.length}장은 빼고 올려요`);
    files = all.filter(x => x.size <= 10 * 1024 * 1024).slice(0, 5);
    if (all.length > 5) toast("한 번에 5장까지 올릴 수 있어요");
    $("#cprev").innerHTML = files.map(x => `<img src="${URL.createObjectURL(x)}" alt="">`).join("");
  };
  f.onsubmit = e => {
    e.preventDefault();
    if (!files.length) return toast("사진을 골라 주세요");
    if (!$("#cagree").checked) return toast("사진 사용 동의에 체크해 주세요");
    const tag = $("#ctag").value === "기타" ? ($("#ctag2").value.trim() || "기타") : $("#ctag").value;
    const story = $("#cstory").value.trim();
    const btn = $("#cbtn");
    run(btn, async () => {
      let n = 0;
      for (const file of files) {
        btn.textContent = `올리는 중… (${n + 1}/${files.length})`;
        const blob = await shrink(file, 2560, 0.9);
        const path = `${me.id}/contest-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
        must(await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" }));
        must(await sb.from("contest_entries").insert({ kind: "photo", image_path: path, shot_tag: tag, story }));
        n++;
      }
      toast(`사진 ${n}장을 올렸어요. 참여해 주셔서 고마워요!`); contestTag = "전체"; router();
    });
  };
}
function openEntry(e, ctx) {
  if (!e || $(".lb")) return;
  const own = e.kind === "photo" && e.author_id === me.id;
  const voted = ctx.myVotes.has(e.id);
  const wrap = document.createElement("div");
  wrap.className = "lb"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true"); wrap.setAttribute("aria-label", "출품작 크게 보기");
  const vid = e.kind === "video" ? ytId(e.video_url) : null;
  wrap.innerHTML = `<div class="lb-in">
    ${e.kind === "photo" ? `<img data-photo="${esc(e.image_path)}" alt="${esc(e.shot_tag)} 출품 사진">`
      : vid ? `<div class="yt" style="border-radius:0"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}" title="출품 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`
      : `<a class="linkcard" href="${esc(safeUrl(e.video_url) || "#")}" target="_blank" rel="noopener">영상 보러 가기 →</a>`}
    <div class="lb-body">
      <div class="row"><span class="pill open">${esc(e.shot_tag)}</span>${e.kind === "video" ? `<span class="pill type">영상</span>` : ""}${ctx.showCounts && ctx.counts[e.id] ? `<span class="pill hot">${ctx.counts[e.id]}표</span>` : ""}</div>
      <p>${entryName(e)} <span class="muted">· ${ago(e.created_at)}</span></p>
      ${e.story ? `<p class="body">${esc(e.story)}</p>` : ""}
      ${vid ? `<a class="muted" href="${esc(e.video_url)}" target="_blank" rel="noopener">재생이 안 되면 유튜브에서 보기 →</a>` : ""}
      <div class="row">
        ${ctx.st === "vote" && !own ? `<button class="btn ${voted ? "sub" : ""}" data-vote>${voted ? "투표 취소" : "이 작품에 투표"}</button>` : ""}
        ${ctx.st === "vote" && own ? `<span class="muted">내 작품이에요</span>` : ""}
        ${(own && ctx.st === "submit") || me.is_admin ? `<button class="btn danger sm" data-del>삭제</button>` : ""}
        <button class="btn line" data-close style="margin-left:auto">닫기</button>
      </div>
    </div></div>`;
  const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  wrap.onclick = ev => { if (ev.target === wrap) close(); };
  wrap.querySelector("[data-close]").onclick = close;
  const vb = wrap.querySelector("[data-vote]");
  if (vb) vb.onclick = () => run(vb, async () => {
    must(await sb.rpc("contest_vote", { p_entry: e.id, p_on: !voted }));
    close(); toast(voted ? "투표를 취소했어요" : "투표했어요!"); router();
  });
  const db = wrap.querySelector("[data-del]");
  if (db) db.onclick = () => {
    if (db.dataset.sure !== "1") { db.dataset.sure = "1"; db.textContent = "한 번 더 누르면 삭제"; return; }
    run(db, async () => {
      if (e.image_path) await sb.storage.from("photos").remove([e.image_path]);
      must(await sb.from("contest_entries").delete().eq("id", e.id));
      close(); toast("삭제했어요"); router();
    });
  };
  document.body.appendChild(wrap);
  hydratePhotos(wrap);
  wrap.querySelector("[data-close]").focus();
}

function bindPollForm() {
  const add = $("#padd"); if (!add) return;
  add.onclick = () => {
    const n = $$(".popi").length;
    if (n >= 10) return toast("항목은 10개까지 넣을 수 있어요");
    $("#popts").insertAdjacentHTML("beforeend", `<input class="popi" maxlength="40" placeholder="항목 ${n + 1}">`);
    if (n + 1 >= 10) add.hidden = true;
  };
  $("#pend").onchange = () => { $("#pendcw").hidden = $("#pend").value !== "custom"; };
}
function readPoll() {
  const sec = $("#pollsec"); if (!sec || !sec.open) return null;
  const question = $("#pq").value.trim();
  const options = [...new Set($$(".popi").map(i => i.value.trim()).filter(Boolean))];
  if (!question && !options.length) return null;
  if (!question) throw new Error("투표 질문을 적어 주세요.");
  if (options.length < 2) throw new Error("투표 항목을 2개 이상 적어 주세요.");
  const v = $("#pend").value;
  let ends_at = null;
  if (v === "custom") {
    if (!$("#pendc").value) throw new Error("투표 마감 시각을 골라 주세요.");
    ends_at = new Date($("#pendc").value).toISOString();
    if (new Date(ends_at) <= new Date()) throw new Error("투표 마감은 지금보다 뒤로 정해 주세요.");
  } else if (v) ends_at = new Date(Date.now() + +v * 864e5).toISOString();
  return { question, options, multi: $("#pmulti").checked, anonymous: $("#panon").checked, ends_at };
}
async function mountPoll(kind, id) {
  const box = $("#pollbox"); if (!box) return;
  const { data: pl } = await sb.from("polls").select("*").eq("target_kind", kind).eq("target_id", id).maybeSingle();
  if (!box.isConnected) return;
  if (!pl) { box.remove(); return; }
  let editing = false;
  const draw = async () => {
    const [{ data: res }, { data: mineRows }, { data: who }] = await Promise.all([
      sb.rpc("poll_results", { p_poll: pl.id }),
      sb.from("poll_votes").select("option_idx").eq("poll_id", pl.id).eq("user_id", me.id),
      pl.anonymous ? Promise.resolve({ data: [] }) : sb.from("poll_votes").select(`option_idx, user:profiles!user_id(${PROFILE})`).eq("poll_id", pl.id),
    ]);
    if (!box.isConnected) return;
    const counts = {}; let voters = 0;
    (res || []).forEach(r => { counts[r.option_idx] = Number(r.votes); voters = Number(r.voters); });
    const mine = new Set((mineRows || []).map(r => r.option_idx));
    const closed = !!pl.ends_at && new Date(pl.ends_at) <= new Date();
    const voted = mine.size > 0;
    const showForm = !closed && (!voted || editing);
    const top = Math.max(0, ...Object.values(counts));
    const canManage = pl.created_by === me.id || me.is_admin;
    const meta = [pl.multi ? "복수 선택" : "1개 선택", pl.anonymous ? "익명" : "공개 투표", closed ? `${fmtDT(pl.ends_at)} 마감됨` : pl.ends_at ? `${fmtDT(pl.ends_at)} 마감` : "마감 없음"];
    const form = `<div class="pollopts">${pl.options.map((o, i) => `<label><input type="${pl.multi ? "checkbox" : "radio"}" name="po" value="${i}" ${mine.has(i) ? "checked" : ""}>${esc(o)}</label>`).join("")}</div>
      <div class="row"><button class="btn" id="pvote">${voted ? "다시 투표하기" : "투표하기"}</button>${editing ? `<button class="btn line" id="pback">취소</button>` : ""}</div>`;
    const results = `<div class="pres">${pl.options.map((o, i) => {
      const c = counts[i] || 0, pct = voters ? Math.round(c / voters * 100) : 0;
      const names = (who || []).filter(w => w.option_idx === i && w.user);
      return `<div class="pr ${c && c === top ? "top" : ""}"><div class="pt"><span><b>${esc(o)}</b>${mine.has(i) ? `<span class="mine">내 선택</span>` : ""}</span><span>${c}표 · ${pct}%</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        ${names.length ? `<details><summary class="muted">${names.length}명 보기</summary><div class="names">${names.map(w => `<span>${nick(w.user)}</span>`).join("")}</div></details>` : ""}</div>`;
    }).join("")}</div>`;
    box.innerHTML = `<div class="card poll">
      <div class="row"><span class="pill ${closed ? "done" : "open"}">${closed ? "투표 마감" : "투표 중"}</span><span class="muted">${meta.join(" · ")}</span></div>
      <h2>${esc(pl.question)}</h2>
      ${showForm ? form : results}
      <p class="muted">${voters}명 참여${pl.anonymous ? " · 누가 투표했는지는 공개되지 않아요" : ""}</p>
      <div class="row">${!showForm && voted && !closed ? `<button class="btn sub sm" id="pedit">선택 바꾸기</button><button class="linkbtn" id="pcancel">투표 취소</button>` : ""}${!showForm && !voted && closed ? `<span class="muted">투표가 끝났어요.</span>` : ""}${canManage && !closed ? `<button class="btn line sm" id="pclose">지금 마감하기</button>` : ""}${canManage ? `<button class="btn danger sm" id="pdel2">투표 삭제</button>` : ""}</div>
    </div>`;
    const v = $("#pvote", box);
    if (v) v.onclick = () => run(v, async () => {
      const picked = $$("input[name=po]:checked", box).map(i => +i.value);
      if (!picked.length) return toast("항목을 골라 주세요");
      must(await sb.rpc("cast_vote", { p_poll: pl.id, p_options: picked }));
      editing = false; toast("투표했어요"); await draw();
    });
    const bk = $("#pback", box); if (bk) bk.onclick = () => { editing = false; draw(); };
    const ed = $("#pedit", box); if (ed) ed.onclick = () => { editing = true; draw(); };
    const cc = $("#pcancel", box); if (cc) cc.onclick = () => run(cc, async () => { must(await sb.rpc("cast_vote", { p_poll: pl.id, p_options: [] })); toast("투표를 취소했어요"); await draw(); });
    const cl = $("#pclose", box);
    if (cl) cl.onclick = () => {
      if (cl.dataset.sure !== "1") { cl.dataset.sure = "1"; cl.textContent = "한 번 더 누르면 마감"; return; }
      run(cl, async () => { const now = new Date().toISOString(); must(await sb.from("polls").update({ ends_at: now }).eq("id", pl.id)); pl.ends_at = now; toast("투표를 마감했어요"); await draw(); });
    };
    const dl = $("#pdel2", box);
    if (dl) dl.onclick = () => {
      if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "한 번 더 누르면 삭제"; return; }
      run(dl, async () => { must(await sb.from("polls").delete().eq("id", pl.id)); box.remove(); toast("투표를 삭제했어요"); });
    };
  };
  try { await draw(); } catch (e) { box.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; }
}

const REASONS = ["웃돈 양도", "욕설·비방", "도배·광고", "사칭·사기", "개인정보 노출", "기타"];

function bindDelete(sel, fn) {

function notiText(n) {
  const who = `<span class="nick">${esc(n.actor?.nickname || "탈퇴한 회원")}</span>님이`;
  const where = { post: "게시글", meetup: "정모", ticket: "양도글" }[n.target_kind] || "글";
  if (n.kind === "report") return `<b>신고 접수</b> · ${esc(n.title)} (${where})`;
  if (n.kind === "mention") return `${who} ${where} <b>${esc(n.title)}</b> 댓글에서 회원님을 불렀어요`;
  if (n.kind === "ticket_request") return `${who} 내 양도글 <b>${esc(n.title)}</b>에 양도 신청을 했어요`;
  return `${who} 내 ${where} <b>${esc(n.title)}</b>에 댓글을 남겼어요`;
}
async function renderNoti() {
  const rows = must(await sb.from("notifications").select("*, actor:profiles!actor_id(nickname)").eq("user_id", me.id).order("created_at", { ascending: false }).limit(100));
  after(() => {
    $$("[data-nid]").forEach(a => a.onclick = async e => {
      e.preventDefault();
      const n = rows.find(x => x.id == a.dataset.nid);
      if (!n.is_read) await sb.from("notifications").update({ is_read: true }).eq("id", n.id);
      location.hash = a.getAttribute("href");
    });
    const all = $("#readall");
    if (all) all.onclick = () => run(all, async () => {
      must(await sb.from("notifications").update({ is_read: true }).eq("user_id", me.id).eq("is_read", false));
      toast("모두 읽음으로 바꿨어요"); router();
    });
  });
  const n0 = rows.filter(n => !n.is_read).length;
  return `
    <div class="head"><h1>나의 알림</h1>${n0 ? `<button class="btn sub sm" id="readall">모두 읽음</button>` : ""}</div>
    <p class="muted">내 글에 댓글이 달리거나, 양도 신청이 오거나, 누군가 @활동명 으로 불렀을 때 알려드려요. 최근 100개까지 보관돼요.</p>
    ${rows.length ? `<div class="list">${rows.map(n => `
      <a class="card ${n.is_read ? "" : "unread"}" href="${KIND[n.target_kind][1]}${n.target_id}" data-nid="${n.id}">
        <div class="noti"><span class="dot ${n.is_read ? "read" : ""}"></span><div class="list" style="gap:4px;min-width:0">
          <p>${notiText(n)}</p>
          ${n.preview ? `<p class="muted body">“${esc(n.preview)}”</p>` : ""}
          <p class="muted">${n.kind === "ticket_request" ? `<span class="pill open">양도 신청</span> ` : ""}${ago(n.created_at)}</p>
        </div></div>
      </a>`).join("")}</div>` : `<div class="card empty"><b>아직 알림이 없어요</b>내 글에 댓글이 달리면 여기에 모여요.</div>`}`;
}

      ${matchMedia("(display-mode: standalone)").matches ? `<p class="muted">지금 앱으로 쓰고 있어요.</p>`
        : installEvt ? `<button class="btn sub wide" id="install">홈 화면에 파란별 추가</button>`
        : `<p class="muted">휴대폰 홈 화면에 파란별 아이콘을 만들면 앱처럼 바로 열 수 있어요.</p>
          <ul class="muted" style="margin:0;padding-left:1.2em"><li>안드로이드 크롬: 오른쪽 위 ⋮ → <b>홈 화면에 추가</b></li><li>삼성 인터넷: 아래 ≡ → <b>현재 페이지 추가</b> → 홈 화면</li><li>아이폰 사파리: 아래 공유 버튼 → <b>홈 화면에 추가</b></li></ul>`}
    </div>
    <button class="btn line wide" id="out">로그아웃</button>
    <details class="card">
      <summary><b>회원 탈퇴</b></summary>
      <p class="muted">탈퇴하면 계정과 내가 쓴 글·댓글·양도글·사진·투표가 모두 지워지고 되돌릴 수 없어요.</p>
      <label>확인을 위해 <b>탈퇴합니다</b>를 입력해 주세요<input id="wq" autocomplete="off"></label>
      <button class="btn danger wide" id="wbtn">탈퇴하기</button>
    </details>
    <p class="fine">파란별은 삼성 라이온즈 구단과 관계없는 비공식 팬 커뮤니티예요 · <a href="#privacy">개인정보 처리방침</a></p>`;
}

// ------------------------------------------------------------------
// 시작
// ------------------------------------------------------------------
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("click", e => { const b = e.target.closest("[data-report]"); if (b) { e.preventDefault(); openReport(b); } });
document.addEventListener("click", e => { const b = e.target.closest("[data-share]"); if (b) { e.preventDefault(); sharePage(b.dataset.share, b.dataset.title || "파란별"); } });
async function sharePage(hash, title) {
  const url = location.origin + location.pathname + "#" + hash;
  const text = `[파란별] ${title}`;
  if (navigator.share && !inKakao) {
    try { await navigator.share({ title: text, text, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast("링크를 복사했어요. 카톡이나 문자에 붙여넣어 주세요"); return; } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = `${text}\n${url}`; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  toast(ok ? "링크를 복사했어요. 카톡이나 문자에 붙여넣어 주세요" : `이 주소를 복사해 주세요: ${url}`);
}
window.addEventListener("hashchange", router);
inAppBanner();
if (sb) {
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recovering = true;
      setTimeout(() => { history.replaceState(null, "", location.pathname + "#reset"); router(); }, 0);
      return;
    }
    if (event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "USER_UPDATED") {
      setTimeout(async () => {
        const before = me && me.id;
        await loadMe();
        const fromLink = /access_token|type=signup|type=recovery/.test(location.hash);
        if (recovering) { if (fromLink) history.replaceState(null, "", location.pathname + "#reset"); router(); return; }
        if (event === "SIGNED_IN" && !fromLink && before && me && before === me.id) return; // 탭 복귀 때 다시 그리지 않음
        if (event === "SIGNED_IN" && fromLink) { history.replaceState(null, "", location.pathname + "#mvp"); }
        let next = null; try { next = sessionStorage.getItem("pb-next"); sessionStorage.removeItem("pb-next"); } catch (e) {}
        if (event === "SIGNED_IN" && next && !before) { if (location.hash === "#" + next) router(); else location.hash = "#" + next; return; }
        if (event === "SIGNED_IN" && (!location.hash || /^#(login|signup|forgot)$/.test(location.hash))) { location.hash = "#mvp"; return; }
        router();
      }, 0);
    }
  });
  loadMe().then(router).catch(e => { console.error(e); router(); });
} else {
  router();
}
})();
</script>
</body>
</html>
