function toast(text) {

function errText(e) {
  const m = (e && (e.message || e.error_description)) || String(e || "");
  if (/Email not confirmed/i.test(m)) return "이메일 인증이 아직 안 됐어요. 메일함의 인증 링크를 눌러 주세요.";
  if (/already registered/i.test(m)) return "이미 가입된 이메일이에요.";
  if (/rate limit|too many/i.test(m)) return "요청이 너무 많아요. 잠시 뒤에 다시 시도해 주세요.";
  if (/duplicate key.*mvp_votes|game_id_user_id/i.test(m)) return "이 경기는 이미 투표했어요.";
  if (/Database error saving new user/i.test(m)) return "아이디나 활동명이 이미 쓰이고 있어요. 다른 걸로 바꿔 주세요.";
  if (/Password should be/i.test(m)) return "비밀번호는 6자 이상이어야 해요.";
  if (/row-level security/i.test(m)) return "권한이 없어요.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "인터넷 연결을 확인해 주세요.";
  if (/LAST_ADMIN/.test(m)) return "마지막 운영자는 탈퇴할 수 없어요. 다른 회원을 운영자로 지정한 뒤 탈퇴해 주세요.";
  if (/reports_reporter_id_kind_target_id_key/.test(m)) return "이미 신고한 글이에요. 운영자가 확인 중이에요.";
  if (/Invalid login credentials/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";
  if (/SELF_REACT/.test(m)) return "내 글에는 누를 수 없어요.";
  if (/NICK_TAKEN/.test(m)) return "이미 다른 회원이 쓰고 있는 활동명이에요.";
  if (/NICK_LEN/.test(m)) return "활동명은 2~12자로 정해 주세요.";
  if (/NICK_SAME/.test(m)) return "지금 쓰고 있는 활동명과 같아요.";
  const w = m.match(/NICK_WAIT:([\d-]+)/); if (w) return `활동명은 30일에 한 번만 바꿀 수 있어요. ${w[1]}부터 다시 바꿀 수 있어요.`;
  if (/Could not find the function/i.test(m)) return "서버 설정이 아직 안 됐어요. 운영자에게 알려 주세요.";
  return m;
}
async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); }

  finally { if (btn && btn.isConnected) btn.disabled = false; }
}

let seq = 0;
let recovering = /type=recovery/.test(location.hash);
async function router() {
  const raw = location.hash.slice(1);
  if (/access_token|error_description|type=signup|type=recovery/.test(raw)) return;
  if (!sb) return renderSetup();
  const i = raw.indexOf("-");
  const name = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? "" : raw.slice(i + 1);
  const my = ++seq;
  if (recovering) { paintChrome(""); return renderReset(); }
  if (name === "privacy") { paintChrome(me ? "me" : ""); window.scrollTo(0, 0); return renderPrivacy(); }
  const tabOf = { mvp: "mvp", games: "mvp", schedule: "mvp", admin: "me", meetups: "meetups", meetup: "meetups", tickets: "tickets", ticket: "tickets", board: "board", media: "board", post: "board", me: "me", noti: "none" };
  if (!me) { paintChrome(""); watchNoti(); return name === "signup" ? renderSignup() : name === "forgot" ? renderForgot() : renderLogin(); }
  if (["login", "signup", "forgot", "reset"].includes(name)) { location.hash = "#mvp"; return; }
  paintChrome(tabOf[name] || "mvp");
  watchNoti(); refreshBell();
  view.innerHTML = `<div class="loading">불러오는 중…</div>`;
  window.scrollTo(0, 0);
  const R = {
    mvp: renderMvp, games: renderGames, schedule: renderSchedule, admin: renderAdmin,
    meetups: renderMeetups, meetup: arg === "new" ? () => renderMeetupForm() : arg.startsWith("edit") ? () => renderMeetupForm(arg.slice(5)) : () => renderMeetup(arg),
    tickets: renderTickets, ticket: arg === "new" ? () => renderTicketForm() : arg.startsWith("edit-") ? () => renderTicketForm(arg.slice(5)) : () => renderTicket(arg),
    board: () => renderBoard("free"), media: () => renderBoard("media"),
    post: arg === "new" ? () => renderPostForm("free") : arg === "newmedia" ? () => renderPostForm("media") : arg.startsWith("edit-") ? () => renderPostEdit(arg.slice(5)) : () => renderPost(arg),
    me: renderMe, noti: renderNoti,
  }[name] || renderMvp;
  try {
    const html = await R(arg);
    if (my !== seq) return;
    if (typeof html === "string") { view.innerHTML = html; hydratePhotos(view); }
  } catch (e) {
    if (my !== seq) return;
    console.error(e);
    view.innerHTML = `<div class="msg err">불러오지 못했어요: ${esc(errText(e))}</div>`;
  }
}
const after = fn => { const s = seq; setTimeout(() => { if (s === seq) fn(); }); };
const cleanQ = s => String(s || "").replace(/[,()%*\\:."'`]/g, " ").replace(/\s+/g, " ").trim().slice(0, 30);
const kstDate = t => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date(t));
// 더 보기: 처음 한 번 불러오고, 버튼을 누를 때마다 다음 묶음을 붙여요
function pager({ box, more, size = 20, fetch, item, empty }) {
  if (!box || !more) return;
  let page = 0;
  const load = async () => {
    const rows = await fetch(page * size, page * size + size - 1);
    if (!box.isConnected) return;
    if (page === 0 && !rows.length) box.innerHTML = empty;
    box.insertAdjacentHTML("beforeend", rows.map(item).join(""));
    hydratePhotos(box);
    page++;
    more.hidden = rows.length < size;
  };
  more.onclick = () => run(more, load);
  load().catch(e => { box.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; });
}

      if (nickname.length < 2 || nickname.length > 12) return bad("활동명은 2~12자로 정해 주세요.");
      if (!/^[a-z0-9_]{4,20}$/.test(username)) return bad("아이디는 영어 소문자, 숫자, _ 로 4~20자여야 해요.");
      if (password.length < 8) return bad("비밀번호는 8자 이상이어야 해요.");
      if (password !== $("#spw2").value) return bad("비밀번호 확인이 일치하지 않아요.");
      if (!$("#sagree").checked) return bad("개인정보 수집·이용에 동의해야 가입할 수 있어요.");
      const ok = must(await sb.rpc("check_available", { p_username: username, p_nickname: nickname }));
      if (!ok.username) return bad("이미 쓰이고 있는 아이디예요.");
      if (!ok.nickname) return bad("이미 쓰이고 있는 활동명이에요.");
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { username, nickname }, emailRedirectTo: location.origin + location.pathname },
      });
      if (error) throw error;
      if (data.user && data.user.identities && data.user.identities.length === 0) return bad("이미 가입된 이메일이에요.");
      if (data.session) return;
      view.innerHTML = `<div class="auth">${authHero()}<div class="card">
        <h2>인증 메일을 보냈어요</h2>
        <p><b>${esc(email)}</b> 메일함에서 인증 링크를 누르면 가입이 끝나요. 메일이 안 보이면 스팸함도 확인해 주세요.</p>
        <a class="btn wide" href="#login">로그인 화면으로</a></div></div>`;
    });
  };
}

const gameSeg = cur => `<div class="seg"><a href="#mvp" class="${cur === "mvp" ? "on" : ""}">MVP 투표</a><a href="#schedule" class="${cur === "schedule" ? "on" : ""}">경기 일정</a></div>`;
async function renderSchedule(arg) {
  const today = kstToday();
  const ym = /^\d{4}-\d{2}$/.test(arg) ? arg : today.slice(0, 7);
  const [y, m] = ym.split("-").map(Number);
  const pad = n => String(n).padStart(2, "0");
  const nextYm = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`, prevYm = m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`;
  const from = `${ym}-01`, to = `${nextYm}-01`;
  const [games, meets] = await Promise.all([
    sb.from("schedule").select("*").gte("game_date", from).lt("game_date", to).order("game_date").then(must),
    sb.from("meetups").select("id,title,meet_at,place").gte("meet_at", new Date(from + "T00:00:00+09:00").toISOString()).lt("meet_at", new Date(to + "T00:00:00+09:00").toISOString()).order("meet_at").then(must),
  ]);
  const days = {};
  const add = (d, h) => { (days[d] = days[d] || []).push(h); };
  games.forEach(g => {
    const res = g.status === "final" && g.score_us != null ? `<span class="r ${g.score_us > g.score_them ? "win" : g.score_us < g.score_them ? "lose" : ""}">${g.score_us > g.score_them ? "승" : g.score_us < g.score_them ? "패" : "무"} ${g.score_us}:${g.score_them}</span>`
      : g.status === "canceled" ? `<span class="r">취소</span>` : `<span class="r">${esc(g.game_time)}</span>`;
    add(g.game_date, `<div class="ev"><span class="tag">경기</span><span><b>${g.is_home === false ? "@" : "vs"} ${esc(g.opponent)}</b><br><span class="muted">${esc(g.stadium)}${g.note ? " · " + esc(g.note) : ""}</span></span>${res}</div>`);
  });
  meets.forEach(x => add(kstDate(x.meet_at), `<a class="ev" href="#meetup-${x.id}"><span class="tag meet">정모</span><span><b>${esc(x.title)}</b><br><span class="muted">${new Date(x.meet_at).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Seoul" })} · ${esc(x.place)}</span></span></a>`));
  const keys = Object.keys(days).sort();
  return `<div class="head"><h1>경기 일정</h1>${me.is_admin ? `<a class="btn sub sm" href="#games">경기 등록</a>` : ""}</div>${gameSeg("schedule")}
    <div class="monthnav"><a class="btn line sm" href="#schedule-${prevYm}">← 이전 달</a><b>${y}년 ${m}월</b><a class="btn line sm" href="#schedule-${nextYm}">다음 달 →</a></div>
    ${keys.length ? keys.map(d => `<div class="day ${d === today ? "today" : ""}"><h3>${fmtDate(d)}${d === today ? " · 오늘" : ""}</h3>${days[d].join("")}</div>`).join("")
      : `<div class="card empty"><b>이 달에는 일정이 없어요</b>경기 일정이 발표되면 파란별 AI가 채워 넣어요. 정모를 열면 여기에도 같이 보여요.</div>`}
    <p class="hint">경기 일정과 결과는 파란별 AI가 매일 확인해서 업데이트해요.</p>`;
}

function voteWindow(dateStr) {
  const start = new Date(dateStr + "T00:00:00+09:00");
  const end = new Date(start.getTime() + 36 * 3600 * 1000); // 다음날 낮 12시
  const now = new Date();
  return { open: now >= start && now < end, before: now < start, end };
}
function tally(list, key, names) {
  const c = Object.fromEntries(names.map(n => [n, 0]));
  list.forEach(v => { if (v[key] in c) c[v[key]]++; });
  const rows = Object.entries(c).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(([n, k], i) => `
    <div class="bar ${i === 0 && k > 0 ? "top" : ""}"><span class="name">${esc(n)}</span>
      <div class="track"><div class="fill" style="width:${(k / max) * 100}%"></div></div><span class="n">${k}표</span></div>`).join("")}</div>`;
}
async function renderMvp() {
  const games = must(await sb.from("games").select("*").order("game_date", { ascending: false }).limit(1));
  const adminLink = me.is_admin ? `<a class="btn sub sm" href="#games">경기 등록</a>` : "";
  const head = `<div class="head"><h1>경기 MVP</h1>${adminLink}</div>${gameSeg("mvp")}`;
  const g = games[0];
  if (!g) return head + `<div class="card empty"><b>아직 등록된 경기가 없어요</b>${me.is_admin ? "오른쪽 위 ‘경기 등록’에서 오늘 경기와 로스터를 올려 주세요." : "운영자가 오늘 경기를 등록하면 투표할 수 있어요."}</div>`;
  const votes = must(await sb.from("mvp_votes").select("pitcher,batter,user_id").eq("game_id", g.id));
  const mine = votes.find(v => v.user_id === me.id);
  const w = voteWindow(g.game_date);
  const band = `<div class="gameband"><span class="muted">${fmtDate(g.game_date)}${g.stadium ? " · " + esc(g.stadium) : ""}</span>
    <span class="vs">삼성 vs ${esc(g.opponent)}</span>
    <span class="muted">${w.open ? `투표 중 · ${fmtDT(w.end)} 마감` : w.before ? "투표는 경기 당일 0시에 열려요" : "투표 마감"} · 참여 ${votes.length}명</span></div>`;

  if (w.open && !mine) {
    const picks = (arr, name) => arr.length
      ? `<div class="picks">${arr.map((p, i) => `<label><input type="radio" name="${name}" id="${name}${i}" value="${esc(p)}" required>${esc(p)}</label>`).join("")}</div>`
      : `<p class="muted">로스터가 아직 없어요.</p>`;
    after(() => {
      const f = $("#vote"); if (!f) return;
      f.onsubmit = e => {

        const pitcher = f.querySelector("input[name=p]:checked")?.value, batter = f.querySelector("input[name=b]:checked")?.value;
        if (!pitcher || !batter) return toast("투수와 타자를 한 명씩 골라 주세요");
        run($("#vbtn"), async () => {
          must(await sb.from("mvp_votes").insert({ game_id: g.id, pitcher, batter }));
          toast("투표했어요!"); router();
        });
      };
    });
    return head + band + `
      <form class="card" id="vote">
        <h2>투수 MVP</h2>${picks(g.pitchers, "p")}
        <h2>타자 MVP</h2>${picks(g.batters, "b")}
        <p class="muted">한 경기에 한 번만 투표할 수 있고, 투표 후에는 바꿀 수 없어요.</p>
        <button class="btn wide" id="vbtn">투표하기</button>
      </form>`;
  }
  return head + band + `
    ${mine ? `<div class="msg">내 투표: 투수 <b>${esc(mine.pitcher)}</b> · 타자 <b>${esc(mine.batter)}</b></div>` : ""}
    <div class="card"><h2>투수 MVP</h2>${tally(votes, "pitcher", g.pitchers)}</div>
    <div class="card"><h2>타자 MVP</h2>${tally(votes, "batter", g.batters)}</div>`;
}

    const e = Object.entries(c).sort((a, b) => b[1] - a[1])[0];

  };

  const g = games.map(x => `

    </div>`).join("");
  const m = meets.map(x => {
    const by = s => x.meetup_votes.filter(v => v.status === s);
    return `<div class="card"><div class="spread"><h3><a href="#meetup-${x.id}">${esc(x.title)}</a></h3><span class="pill open">참석 ${by("yes").length}${x.capacity ? "/" + x.capacity : ""}</span></div>

      ${x.meetup_votes.length ? `<details><summary>투표한 사람 보기</summary>
        ${x.meetup_votes.map(v => `<div class="vrow"><span>${nick(v.user)}</span><span>${ATT[v.status]}</span></div>`).join("")}</details>` : ""}</div>`;
  }).join("");
  return `<h2>경기 MVP 투표</h2>${g ? `<div class="list">${g}</div>` : `<p class="muted">등록된 경기가 없어요.</p>`}
    <h2>정모 참석 투표</h2>${m ? `<div class="list">${m}</div>` : `<p class="muted">정모가 없어요.</p>`}`;
}

const signed = new Map();
async function hydratePhotos(root = document) {
  const imgs = $$("img[data-photo]", root).filter(i => !i.getAttribute("src"));
  if (!imgs.length) return;
  const now = Date.now();
  const need = [...new Set(imgs.map(i => i.dataset.photo).filter(p => !(signed.get(p)?.t > now)))];
  if (need.length) {
    const { data } = await sb.storage.from("photos").createSignedUrls(need, 3600);
    (data || []).forEach(d => { if (d.signedUrl) signed.set(d.path, { u: d.signedUrl, t: now + 50 * 60000 }); });
  }
  imgs.forEach(i => { const s = signed.get(i.dataset.photo); if (s) i.src = s.u; });
}
const POST_COLS = `id,title,body,image_paths,is_notice,like_count,dislike_count,created_at,board,media_type,link_url,link_site,is_ai, author:profiles!author_id(${PROFILE})`;

function ytId(u) {
  try {
    const x = new URL(u); const h = x.hostname.replace(/^www\.|^m\./, "");
    if (h === "youtu.be") return x.pathname.slice(1).split("/")[0] || null;
    if (h === "youtube.com" || h === "youtube-nocookie.com") {
      if (x.searchParams.get("v")) return x.searchParams.get("v");
      const m = x.pathname.match(/^\/(shorts|live|embed)\/([\w-]{6,})/); return m ? m[2] : null;
    }
  } catch (e) {}
  return null;
}
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; } };
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
}

async function mountComments(kind, id, opt = {}) {
  const box = $("#cmts"); if (!box) return;
  const load = async () => {
    const rows = must(await sb.from("comments").select(`*, author:profiles!author_id(${PROFILE})`).eq("kind", kind).eq("target_id", id).order("created_at"));
    if (!box.isConnected) return;
    box.innerHTML = `<div class="comments">
      ${rows.map(c => `<div class="cmt"><div class="spread"><p class="muted">${nick(c.author)} · ${ago(c.created_at)}</p>
        <span class="cmt-acts">${!opt.closed && c.author && c.author_id !== me.id ? `<button class="linkbtn" data-reply="${esc(c.author.nickname)}">답글</button>` : ""}${c.author_id !== me.id ? `<button class="linkbtn" data-report="comment" data-rid="${c.id}" data-ref="${kind}" data-refid="${id}">신고</button>` : ""}${c.author_id === me.id || me.is_admin ? `<button class="btn danger sm" data-cdel="${c.id}">삭제</button>` : ""}</span></div>
        <p class="body">${esc(c.body)}</p></div>`).join("") || `<p class="muted">아직 댓글이 없어요.</p>`}
      ${opt.closed ? "" : `<form class="cmt-form" id="cf"><textarea id="cbody" maxlength="1000" required placeholder="${esc(opt.placeholder || "댓글을 남겨 주세요")}"></textarea><button class="btn" id="cbtn">등록</button></form>
      <p class="hint">@활동명 을 넣으면 그 회원에게 알림이 가요.</p>`}
    </div>`;
    $$("[data-cdel]", box).forEach(b => b.onclick = () => {
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "정말 삭제"; return; }
      run(b, async () => { must(await sb.from("comments").delete().eq("id", b.dataset.cdel)); load(); });
    });
    $$("[data-reply]", box).forEach(b => b.onclick = () => {
      const ta = $("#cbody", box); if (!ta) return;
      const tag = `@${b.dataset.reply} `;
      if (!ta.value.includes(tag)) ta.value = tag + ta.value;
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    });
    const f = $("#cf", box);
    if (f) f.onsubmit = e => {
      e.preventDefault();
      const body = $("#cbody", box).value.trim(); if (!body) return;
      run($("#cbtn", box), async () => {
        must(await sb.from("comments").insert({ kind, target_id: id, body }));
        await load();
        if (kind === "ticket") router();
      });
    };
  };
  try { await load(); } catch (e) { box.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; }
}
// 신고 (게시글·댓글·양도글·정모 공용)
const REASONS = ["웃돈 양도", "욕설·비방", "도배·광고", "사칭·사기", "개인정보 노출", "기타"];
function openReport(b) {
  const host = b.closest(".cmt") || b.closest(".card") || b.parentElement;
  if (host.querySelector(".report")) return;
  const f = document.createElement("form");
  f.className = "report";
  f.innerHTML = `<b>신고하기</b>
    <label>사유<select name="reason">${REASONS.map(r => `<option>${r}</option>`).join("")}</select></label>
    <label>자세한 내용 (선택)<textarea name="detail" maxlength="500" style="min-height:60px"></textarea></label>
    <div class="row"><button class="btn sm">신고 접수</button><button type="button" class="btn line sm" data-x>취소</button></div>
    <p class="hint">신고 내용은 운영자만 볼 수 있어요.</p>`;
  host.appendChild(f);
  f.querySelector("[data-x]").onclick = () => f.remove();
  f.onsubmit = e => {
    e.preventDefault();
    run(f.querySelector(".btn"), async () => {
      must(await sb.from("reports").insert({ kind: b.dataset.report, target_id: +b.dataset.rid, ref_kind: b.dataset.ref, ref_id: +b.dataset.refid, reason: f.elements.reason.value, detail: f.elements.detail.value.trim() }));
      f.remove(); toast("신고를 접수했어요. 운영자가 확인할게요");
    });
  };
}
function bindDelete(sel, fn) {
  const b = $(sel); if (!b) return;
  b.onclick = () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "한 번 더 누르면 삭제"; return; }
    run(b, async () => { await fn(); toast("삭제했어요"); });
  };
}

  const where = { post: "게시글", meetup: "정모", ticket: "양도글" }[n.target_kind] || "글";
  if (n.kind === "report") return `<b>신고 접수</b> · ${esc(n.title)} (${where})`;
  if (n.kind === "mention") return `${who} ${where} <b>${esc(n.title)}</b> 댓글에서 회원님을 불렀어요`;
  if (n.kind === "ticket_request") return `${who} 내 양도글 <b>${esc(n.title)}</b>에 양도 신청을 했어요`;
  return `${who} 내 ${where} <b>${esc(n.title)}</b>에 댓글을 남겼어요`;
}
async function renderNoti() {
  const rows = must(await sb.from("notifications").select("*, actor:profiles!actor_id(nickname)").eq("user_id", me.id).order("created_at", { ascending: false }).limit(100));
  after(() => {
    $$("[data-nid]").forEach(a => a.onclick = async e => {
      e.preventDefault();
      const n = rows.find(x => x.id == a.dataset.nid);
      if (!n.is_read) await sb.from("notifications").update({ is_read: true }).eq("id", n.id);
      location.hash = a.getAttribute("href");
    });
    const all = $("#readall");
    if (all) all.onclick = () => run(all, async () => {
      must(await sb.from("notifications").update({ is_read: true }).eq("user_id", me.id).eq("is_read", false));
      toast("모두 읽음으로 바꿨어요"); router();
    });
  });
  const n0 = rows.filter(n => !n.is_read).length;
  return `
    <div class="head"><h1>나의 알림</h1>${n0 ? `<button class="btn sub sm" id="readall">모두 읽음</button>` : ""}</div>
    <p class="muted">내 글에 댓글이 달리거나, 양도 신청이 오거나, 누군가 @활동명 으로 불렀을 때 알려드려요. 최근 100개까지 보관돼요.</p>
    ${rows.length ? `<div class="list">${rows.map(n => `
      <a class="card ${n.is_read ? "" : "unread"}" href="${KIND[n.target_kind][1]}${n.target_id}" data-nid="${n.id}">
        <div class="noti"><span class="dot ${n.is_read ? "read" : ""}"></span><div class="list" style="gap:4px;min-width:0">
          <p>${notiText(n)}</p>
          ${n.preview ? `<p class="muted body">“${esc(n.preview)}”</p>` : ""}
          <p class="muted">${n.kind === "ticket_request" ? `<span class="pill open">양도 신청</span> ` : ""}${ago(n.created_at)}</p>
        </div></div>
      </a>`).join("")}</div>` : `<div class="card empty"><b>아직 알림이 없어요</b>내 글에 댓글이 달리면 여기에 모여요.</div>`}`;
}

// ------------------------------------------------------------------
// 내 정보
// ------------------------------------------------------------------
async function renderMe() {
  await loadMe();
  const [{ count: tOpen }, { count: tDone }, { count: posts }] = await Promise.all([
    sb.from("tickets").select("id", { count: "exact", head: true }).eq("seller_id", me.id).eq("status", "open"),
    sb.from("tickets").select("id", { count: "exact", head: true }).eq("seller_id", me.id).eq("status", "done"),
    sb.from("posts").select("id", { count: "exact", head: true }).eq("author_id", me.id),
  ]);
  const nextNick = me.nickname_changed_at ? new Date(new Date(me.nickname_changed_at).getTime() + 30 * 864e5) : null;
  const canNick = !nextNick || nextNick <= new Date();
  after(() => {
    $("#out").onclick = ev => run(ev.target, async () => { await sb.auth.signOut(); location.hash = "#login"; });
    const ib = $("#install"); if (ib) ib.onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; router(); };
    $("#wbtn").onclick = ev => {
      if ($("#wq").value.trim() !== "탈퇴합니다") return toast("‘탈퇴합니다’를 정확히 입력해 주세요");
      run(ev.target, async () => {
        const { data: files } = await sb.storage.from("photos").list(me.id, { limit: 1000 });
        if (files && files.length) await sb.storage.from("photos").remove(files.map(f => `${me.id}/${f.name}`));
        must(await sb.rpc("delete_my_account"));
        try { await sb.auth.signOut(); } catch (e) {}
        me = null; toast("탈퇴했어요. 그동안 함께해 주셔서 고마워요"); location.hash = "#login"; router();
      });
    };
    const f = $("#nf"); if (!f) return;
    f.onsubmit = e => {
      e.preventDefault();
      const v = $("#nn").value.trim();
      if (v.length < 2 || v.length > 12) return toast("활동명은 2~12자로 정해 주세요");
      if (v === me.nickname) return toast("지금 쓰고 있는 활동명과 같아요");
      const b = $("#nbtn");
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = `‘${v}’(으)로 바꾸기`; return; }
      run(b, async () => {
        must(await sb.rpc("change_nickname", { p_nickname: v }));
        await loadMe(); toast("활동명을 바꿨어요"); router();
      });
    };
    $("#nn").oninput = () => { const b = $("#nbtn"); b.dataset.sure = ""; b.textContent = "활동명 바꾸기"; };
  });
  paintChrome("me");
  return `
    <h1>내 정보</h1>
    <div class="card">
      <div class="spread"><div><h2>${esc(me.nickname)}</h2><p class="muted">아이디 @${esc(me.username)}${me.is_admin ? " · 운영자" : ""}</p></div>
        <div style="text-align:right"><p class="muted">양도온도</p><p style="font-family:var(--display);font-size:1.6rem;color:var(--blue)">${Number(me.temp).toFixed(1)}°</p></div></div>
      <dl class="meta"><dt>이메일</dt><dd>${esc(me.email)}</dd><dt>가입일</dt><dd>${new Date(me.created_at).toLocaleDateString("ko-KR")}</dd>
        <dt>양도</dt><dd>진행중 ${tOpen ?? 0}건 · 완료 ${tDone ?? 0}건</dd><dt>게시글</dt><dd>${posts ?? 0}개</dd></dl>
      <p class="hint">양도를 한 번 완료할 때마다 양도온도가 1도씩 올라가요. 활동명 옆에 작게 표시돼요.</p>
    </div>
    <div class="card">
      <h2>활동명 변경</h2>
      ${canNick ? `<form id="nf">
        <label>새 활동명<input id="nn" maxlength="12" required value="${esc(me.nickname)}"><span class="hint">2~12자. 바꾸면 30일 동안 다시 바꿀 수 없어요. 지금까지 쓴 글과 댓글에도 새 이름이 보여요.</span></label>
        <button class="btn sub wide" id="nbtn">활동명 바꾸기</button>
      </form>` : `<p class="muted">활동명은 30일에 한 번만 바꿀 수 있어요. <b>${nextNick.toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul" })}</b>부터 다시 바꿀 수 있어요.</p>`}
    </div>
    ${me.is_admin ? `<a class="btn wide" href="#admin">관리자 화면</a><a class="btn sub wide" href="#games">경기·로스터 등록</a>` : ""}
    <div class="card">
      <h2>앱처럼 쓰기</h2>
      ${matchMedia("(display-mode: standalone)").matches ? `<p class="muted">지금 앱으로 쓰고 있어요.</p>`
        : installEvt ? `<button class="btn sub wide" id="install">홈 화면에 파란별 추가</button>`
        : `<p class="muted">휴대폰 홈 화면에 파란별 아이콘을 만들면 앱처럼 바로 열 수 있어요.</p>
          <ul class="muted" style="margin:0;padding-left:1.2em"><li>안드로이드 크롬: 오른쪽 위 ⋮ → <b>홈 화면에 추가</b></li><li>삼성 인터넷: 아래 ≡ → <b>현재 페이지 추가</b> → 홈 화면</li><li>아이폰 사파리: 아래 공유 버튼 → <b>홈 화면에 추가</b></li></ul>`}
    </div>
    <button class="btn line wide" id="out">로그아웃</button>
    <details class="card">
      <summary><b>회원 탈퇴</b></summary>
      <p class="muted">탈퇴하면 계정과 내가 쓴 글·댓글·양도글·사진·투표가 모두 지워지고 되돌릴 수 없어요.</p>
      <label>확인을 위해 <b>탈퇴합니다</b>를 입력해 주세요<input id="wq" autocomplete="off"></label>
      <button class="btn danger wide" id="wbtn">탈퇴하기</button>
    </details>
    <p class="fine">파란별은 삼성 라이온즈 구단과 관계없는 비공식 팬 커뮤니티예요 · <a href="#privacy">개인정보 처리방침</a></p>`;
}

// ------------------------------------------------------------------
// 시작
// ------------------------------------------------------------------
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("click", e => { const b = e.target.closest("[data-report]"); if (b) { e.preventDefault(); openReport(b); } });
window.addEventListener("hashchange", router);
if (sb) {
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recovering = true;
      setTimeout(() => { history.replaceState(null, "", location.pathname + "#reset"); router(); }, 0);
      return;
    }
    if (event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "USER_UPDATED") {
      setTimeout(async () => {
        const before = me && me.id;
        await loadMe();
        const fromLink = /access_token|type=signup|type=recovery/.test(location.hash);
        if (recovering) { if (fromLink) history.replaceState(null, "", location.pathname + "#reset"); router(); return; }
        if (event === "SIGNED_IN" && !fromLink && before && me && before === me.id) return; // 탭 복귀 때 다시 그리지 않음
        if (event === "SIGNED_IN" && fromLink) { history.replaceState(null, "", location.pathname + "#mvp"); }
        if (event === "SIGNED_IN" && (!location.hash || /^#(login|signup|forgot)$/.test(location.hash))) { location.hash = "#mvp"; return; }
        router();
      }, 0);
    }
  });
  loadMe().then(router).catch(e => { console.error(e); router(); });
} else {
  router();
}
})();
</script>
</body>
</html>
